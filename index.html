<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hallo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Animierter Weltall-Hintergrund Canvas -->
    <canvas id="spaceCanvas"></canvas>

    <div class="card">
        <div class="heart-icon">✨</div>
        <h1>Hallo...</h1>
        <p class="subtitle">Ich hab da mal eine wichtige Frage an dich haha...</p>
        
        <div class="question-container">
            <p class="question">Wollen wir demnächst zusammen was unternehmen? :)</p>
        </div>

        <div class="btn-group">
            <button id="yesBtn" class="btn btn-yes">Ja, bitte</button>
            <button id="noBtn" class="btn btn-no">Ne hs</button>
        </div>

        <!-- Fake-Ladebalken Container (anfangs versteckt) -->
        <div id="loadingContainer" class="hidden">
            <p id="loadingStatus">Analysiere...</p>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>

        <!-- Success Message (anfangs versteckt) -->
        <div id="successMessage" class="hidden">
            <h2>LETS GOOOOOOOOOO</h2>
            <p>ja cool, wie auch immer (nonchalant)</p>
        </div>
    </div>

    <!-- Pop-up Modal für die Bestätigung -->
    <div id="confirmModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>nahhh u trippin...</h3>
            <p>bist du sicher?</p>
            <button id="confirmYesBtn" class="btn btn-yes">Ja, bitte bitte bitte bitte</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
